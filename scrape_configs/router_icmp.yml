scrape_configs:
  - job_name: "router_icmp"
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
        - router.shed.internal.bts-crew.com
        - router.alt.internal.bts-crew.com
        - router.weston.internal.bts-crew.com
        - router.office.internal.bts-crew.com
        - router.drama.internal.bts-crew.com
        - router.tub.internal.bts-crew.com
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115  # The blackbox exporter's real hostname:port.
